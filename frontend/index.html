
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="AnswerlyAbhi - Your personal AI assistant powered by Gemini."
    >

    <meta name="theme-color" content="#0b0d10">

    <title>AnswerlyAbhi — AI Assistant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/python.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/javascript.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/sql.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/xml.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/css.min.js"></script>

</head>


<body>

<div class="app">


    <!-- MOBILE OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebar-overlay"
    ></div>


    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="sidebar"
    >

        <div class="sidebar-top">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div class="brand-text">

                    <strong>
                        AnswerlyAbhi
                    </strong>

                    <span>
                        AI Assistant
                    </span>

                </div>

            </div>


            <button
                type="button"
                class="icon-button mobile-close"
                id="close-sidebar"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>


        <!-- NEW CHAT -->

        <button
            type="button"
            class="new-chat"
            id="new-chat"
        >

            <span class="new-chat-icon">
                +
            </span>

            <span>
                New Chat
            </span>

        </button>


        <!-- CHAT SEARCH -->

        <div class="chat-search">

            <span>
                🔍
            </span>

            <input
                type="text"
                id="chat-search"
                placeholder="Search chats"
                autocomplete="off"
            >

        </div>


        <!-- CHAT HISTORY -->

        <div
            id="chat-list"
            class="chat-list"
        ></div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button
                type="button"
                class="sidebar-item"
                id="theme-toggle"
            >

                <span>
                    ◐
                </span>

                <span>
                    Theme
                </span>

            </button>


            <div class="sidebar-footer">

                <div class="profile-avatar">
                    A
                </div>

                <div class="profile-info">

                    <strong>
                        AnswerlyAbhi
                    </strong>

                    <span>
                        Personal AI
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <section class="main">


        <!-- HEADER -->

        <header class="topbar">


            <button
                type="button"
                class="icon-button menu-button"
                id="open-sidebar"
                aria-label="Open menu"
            >
                ☰
            </button>


            <div class="topbar-title">

                <div class="mobile-brand-icon">
                    ✦
                </div>

                <div>

                    <h1>
                        AnswerlyAbhi
                    </h1>

                    <div class="status">

                        <span class="status-dot"></span>

                        <span>
                            Gemini AI
                        </span>

                    </div>

                </div>

            </div>


            <div class="topbar-actions">

                <button
                    type="button"
                    class="icon-button"
                    id="clear-chat"
                    title="Clear conversation"
                    aria-label="Clear conversation"
                >
                    🗑
                </button>

            </div>

        </header>


        <!-- CHAT -->

        <main
            id="chat"
            class="chat"
        >

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-icon">
                    ✦
                </div>

                <h2>
                    How can I help you today?
                </h2>

                <p>
                    Ask anything, learn something new,
                    write code, or solve a problem.
                </p>


                <!-- SUGGESTIONS -->

                <div class="suggestions">


                    <button
                        type="button"
                        class="suggestion"
                        data-prompt="Explain artificial intelligence in simple words."
                    >

                        <span>
                            💡
                        </span>

                        <div>

                            <strong>
                                Explain something
                            </strong>

                            <small>
                                Make a complex topic simple
                            </small>

                        </div>

                    </button>


                    <button
                        type="button"
                        class="suggestion"
                        data-prompt="Help me write a professional resume."
                    >

                        <span>
                            📝
                        </span>

                        <div>

                            <strong>
                                Write something
                            </strong>

                            <small>
                                Create professional content
                            </small>

                        </div>

                    </button>


                    <button
                        type="button"
                        class="suggestion"
                        data-prompt="Help me debug this Python code."
                    >

                        <span>
                            💻
                        </span>

                        <div>

                            <strong>
                                Write code
                            </strong>

                            <small>
                                Build or debug your project
                            </small>

                        </div>

                    </button>


                    <button
                        type="button"
                        class="suggestion"
                        data-prompt="Give me some creative business ideas."
                    >

                        <span>
                            🚀
                        </span>

                        <div>

                            <strong>
                                Brainstorm ideas
                            </strong>

                            <small>
                                Explore new possibilities
                            </small>

                        </div>

                    </button>

                </div>

            </div>

        </main>


        <!-- INPUT -->

        <div class="composer-wrapper">

            <div class="input-area">


                <label
                    for="pdf"
                    class="attachment-button"
                    title="Attach PDF"
                    aria-label="Attach PDF"
                >
                    📎
                </label>


                <input
                    type="file"
                    id="pdf"
                    accept=".pdf,application/pdf"
                    hidden
                >


                <textarea
                    id="message"
                    rows="1"
                    placeholder="Message AnswerlyAbhi..."
                    autocomplete="off"
                    spellcheck="true"
                ></textarea>


                <button
                    type="button"
                    id="send"
                    class="send-button"
                    aria-label="Send message"
                    title="Send message"
                >
                    ➤
                </button>


                <button
                    type="button"
                    id="stop"
                    class="stop-button"
                    aria-label="Stop generating"
                    title="Stop generating"
                    style="display: none;"
                >
                    ■
                </button>

            </div>


            <div
                id="file-status"
                class="file-status"
                style="display: none;"
            ></div>


            <p class="composer-note">
                AnswerlyAbhi can make mistakes. Check important information.
            </p>

        </div>

    </section>

</div>


<!-- JAVASCRIPT -->

<script src="app.js"></script>

</body>
</html>
